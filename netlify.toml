# Netlify builds the site from source; `astro build` writes every page as HTML into dist/.
# Redirects and cache headers live in public/_redirects and public/_headers, which Cloudflare Pages reads too.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node 22 (also pinned in .node-version)
  NODE_VERSION = "22"
